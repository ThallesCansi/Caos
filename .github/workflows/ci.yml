name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest
