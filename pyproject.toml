[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amazon-chaos"
version = "0.1.0"
description = "Pipeline reprodutível para o TCC sobre dinâmica não linear do sistema floresta-atmosfera amazônico"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Caio Marcelo Cavallari Ruas" },
  { name = "Thalles José de Souza Cansi" },
]
dependencies = [
  "cdsapi>=0.7.7",
  "geopandas>=1.0",
  "marimo>=0.14",
  "matplotlib>=3.9",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "netcdf4>=1.7",
  "nolds>=0.6",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "rasterio>=1.4",
  "requests>=2.32",
  "rioxarray>=0.18",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "shapely>=2.0",
  "statsmodels>=0.14",
  "typer>=0.12",
  "xarray>=2024.7",
  "dask[array]>=2024.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
amazon-chaos = "amazon_chaos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/amazon_chaos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["amazon_chaos"]
