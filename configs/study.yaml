# Parâmetros comuns a todas as regiões. Cada configs/regions/<slug>.yaml é mesclado
# sobre este arquivo por amazon_chaos.config.load_region (o arquivo da região vence).
# Método e justificativas: docs/metodologia.md.

time:
  science_start: 2001-01-01      # janela principal
  science_end: 2024-12-31
  archive_start: 1990-01-01      # arquivo anterior, só sensibilidade (D-006)
  normal: [1991-01-01, 2020-12-31]
  utc_offset_hours: -3           # dia local fixo UTC−03:00
  test_start: 2024-01-01         # mês curto para testar uma região nova
  test_end: 2024-01-31

spatial:
  grid_degrees: 0.25
  equal_area_crs: EPSG:6933

era5:
  dataset: reanalysis-era5-single-levels
  product_type: reanalysis
  data_format: netcdf
  download_format: unarchived
  variables:
    instant:
      - 2m_temperature
      - 2m_dewpoint_temperature
      - surface_pressure
      - 10m_u_component_of_wind
      - 10m_v_component_of_wind
    accum:
      - total_precipitation

# Camadas de contexto cartográfico baixadas por `amazon-chaos region prepare`.
context:
  layers: [rios, cidades, ucs, tis, biomas]
  margin_degrees: 0.75
