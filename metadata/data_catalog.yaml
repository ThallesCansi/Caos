    raw_formats: [NetCDF]
    notes:
      - Separate instantaneous and accumulated variables during acquisition.
      - Preserve raw files and request metadata.

  ERA5_Land:
    role: optional_surface_land_complement
    institution: ECMWF / Copernicus Climate Change Service
